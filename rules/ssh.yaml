# SSH-specific rules — reconnaissance, scanning and protocol misuse.

category: ssh

rules:
  - name: SSH Invalid User Enumeration
    description: >
      Repeated failed logins for usernames that do not exist on the host.
      Attackers enumerate valid accounts this way before launching a targeted
      brute force.
    severity: MEDIUM
    threshold: 4
    time_window: 300
    rule_definition:
      event_type: SSH_LOGIN_FAILURE
      key: source_ip
      reason: invalid_user

  - name: SSH Max Authentication Attempts
    description: >
      A client exceeded the allowed number of SSH authentication attempts from
      the same source, commonly the tail end of an aggressive brute-force run.
    severity: MEDIUM
    threshold: 2
    time_window: 300
    rule_definition:
      event_type: SSH_LOGIN_FAILURE
      key: source_ip
      reason: max_attempts

  - name: SSH Port Scan Disconnect
    description: >
      A source repeatedly connects then disconnects during the SSH pre-auth
      phase — consistent with service probing and port scanning activity.
    severity: LOW
    threshold: 5
    time_window: 600
    rule_definition:
      event_type: SSH_LOGIN_FAILURE
      key: source_ip
      reason: preauth_disconnect